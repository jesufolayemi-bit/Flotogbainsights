# Pages CMS (https://pagescms.org) — edit blog posts in the browser.
# Sign in at app.pagescms.org with GitHub and open this repo.
media:
  input: src/images/blog
  output: /images/blog

content:
  - name: posts
    label: Blog posts
    type: collection
    path: src/blog
    filename: "{fields.slug}.md"
    view:
      fields: [title, series, day, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title (the H1 and Google title)
        type: string
        required: true
      - name: slug
        label: URL slug (lowercase-words-with-dashes, becomes /blog/slug/)
        type: string
        required: true
      - name: series
        label: Series name (same for all 5 days of a week)
        type: string
      - name: day
        label: Day in series (1-5)
        type: number
      - name: dek
        label: Subtitle
        type: string
      - name: description
        label: Google description (under 160 characters)
        type: text
        required: true
      - name: date
        label: Publish date (pick a future date to schedule; it goes live at about 6am Dubai that day)
        type: date
        options:
          time: true
        required: true
      - name: cover
        label: Cover image
        type: image
      - name: readingTime
        label: Minutes to read
        type: number
      - name: linkedinPost
        label: LinkedIn post text (the "tell your network" box when you publish the article)
        type: text
      - name: linkedinFormat
        label: LinkedIn format for this day (article is the default; leave blank for article)
        type: select
        options:
          values:
            - { value: article, label: Article (default) }
            - { value: carousel, label: PDF carousel }
            - { value: poll, label: Poll }
      - name: carouselPdf
        label: Carousel PDF (carousel days only)
        type: file
        options:
          path: src/images/blog/carousels
          extensions: [pdf]
      - name: carouselCaption
        label: Carousel caption (carousel days only)
        type: text
      - name: pollQuestion
        label: Poll question (poll days only, 140 characters max)
        type: string
      - name: pollOptions
        label: Poll options (2 to 4, each 30 characters max)
        type: string
        list: true
      - name: pollIntro
        label: Poll intro text (poll days only)
        type: text
      - name: body
        label: Post
        type: rich-text
